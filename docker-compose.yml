services:
  mongodb:
    image: mongo:7.0.14
    restart: unless-stopped
    ports:
      - "27028:27017"
    environment:
      - MONGO_INITDB_DATABASE=desafio_senior
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  mongo_data:
    driver: local
